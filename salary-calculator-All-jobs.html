// מחשב נקודות זיכוי למילואים
function calcMiluimPoints(days) {
  if (days < 30) return 0;
  if (days < 40) return 0.5;
  if (days < 50) return 0.75;
  const addPts = Math.floor((days - 50) / 5) * 0.25;
  return Math.min(1.0 + addPts, 4.0);
}

// מחשב מס הכנסה חודשי לפי מדרגות 2024
function calcIncomeTax(monthly) {
  const brackets = [
    {up: 7010,  rate: 0.10},
    {up: 10060, rate: 0.14},
    {up: 16150, rate: 0.20},
    {up: 22440, rate: 0.31},
    {up: 46690, rate: 0.35},
    {up: 60130, rate: 0.47},
    {up: Infinity, rate: 0.50},
  ];
  let tax = 0, prev = 0;
  for (const b of brackets) {
    if (monthly <= prev) break;
    tax += (Math.min(monthly, b.up) - prev) * b.rate;
    prev = b.up;
  }
  return tax;
}

// ביטוח לאומי + בריאות (משולב כמו במקור)
function calcSocialSecurity(gross) {
  if (gross <= 7522) return gross * 0.0395;
  return (7522 * 0.0395) + ((gross - 7522) * 0.12);
}

function calcAll(baseSalary, contract, params) {
  const {
    overtimeHours, carType, childrenUnder5, children6to18,
    gender, hasDegree, partnerWorks, miluimDays, insuranceCost,
    vehicleRegFee, travelAllowance,
    companyCar, companyCarGroup,
    includeInsuranceRefund, includeStudyFund, includePension,
    includeRecovery, includeClothing, includeGifts,
    localityGroupData,
  } = params;

  const cp = CAR_PACKAGES[carType];
  const hourlyRate = baseSalary / 182;
  const ot125h = overtimeHours * (2/3);
  const ot150h = overtimeHours * (1/3);
  const overtimePay = (hourlyRate * 1.25 * ot125h) + (hourlyRate * 1.50 * ot150h);
  const travelPay = travelAllowance || 323;
  // זקיפת הטבה לרכב צמוד (נוסף לברוטו למס)
  const COMPANY_CAR_IMPUTATION = { 3: 4390, 4: 5260, 5: 7280 };
  const companyCarImputation = companyCar ? (COMPANY_CAR_IMPUTATION[companyCarGroup] || 0) : 0;
  const carGross = cp.value + travelPay; // חבילת רכב שירות + קצובת נסיעה
  const maonotPay = (partnerWorks && childrenUnder5 > 0) ? (Math.min(childrenUnder5, 2) * 330) : 0;
  const totalGross = baseSalary + overtimePay + carGross + maonotPay + companyCarImputation;

  // נקודות זיכוי
  let points = gender === "female" ? 2.75 : 2.25;
  if (hasDegree) points += 1;
  points += childrenUnder5 * 2.5;
  points += children6to18 * 1;
  const miluimPoints = calcMiluimPoints(miluimDays);
  points += miluimPoints;
  const taxCreditValue = points * 242;

  // הנחת יישובים מזכים — הפחתה ישירה ממס הכנסה
  const localityBenefit = localityGroupData
    ? Math.min(Math.min(totalGross, localityGroupData.monthlyCeiling) * localityGroupData.rate, localityGroupData.maxMonthlyBenefit)
    : 0;

  // מס הכנסה
  let incomeTax = Math.max(0, calcIncomeTax(totalGross) - taxCreditValue - localityBenefit);

  // ביטוח לאומי + בריאות
  const socialSecurity = calcSocialSecurity(totalGross);

  // ניכויי עובד
  const pensionDed = baseSalary * contract.pensionEmployee;
  const studyFundDed = baseSalary * contract.studyFundEmployee;
  const unionDues = 50;
  const totalDeductions = incomeTax + socialSecurity + pensionDed + studyFundDed + unionDues;
  const netSalary = totalGross - totalDeductions;

  // הפרשות מעסיק
  const studyFundEmployer = baseSalary * contract.studyFundEmployer;
  const pensionEmployer = baseSalary * contract.pensionEmployer;

  // הטבות נוספות
  const recoveryPay = 350;
  const clothing = 125;
  const gifts = 100;
  const insuranceRefundMonthly = cp.isCar ? Math.min(insuranceCost, 7000) / 12 : 0;
  const regFeeRefundMonthly = cp.isCar ? Math.min(vehicleRegFee || 0, 2326) / 12 : 0;

  let totalEconomicValue = netSalary;
  if (includeInsuranceRefund) totalEconomicValue += insuranceRefundMonthly + regFeeRefundMonthly;
  if (includeStudyFund) totalEconomicValue += studyFundEmployer;
  if (includePension) totalEconomicValue += pensionEmployer;
  if (includeRecovery) totalEconomicValue += recoveryPay;
  if (includeClothing) totalEconomicValue += clothing;
  if (includeGifts) totalEconomicValue += gifts;

  return {
    baseSalary, overtimePay, ot125h, ot150h, carGross, maonotPay,
    totalGross, points, miluimPoints, taxCreditValue,
    localityBenefit,
    incomeTax, socialSecurity, pensionDed, studyFundDed, unionDues,
    totalDeductions, netSalary, insuranceRefundMonthly, regFeeRefundMonthly,
    studyFundEmployer, pensionEmployer, totalEconomicValue,
    hourlyRate, recoveryPay, clothing, gifts, travelAllowance,
    companyCarImputation,
  };
}

  File:    ({c}) => <svg className={c} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>,

};

  const [vehicleRegFee, setRegFee]  = useState(0);
  const [travelAllowance, setTravel] = useState(323);
  const [childrenUnder5, setCh5]    = useState(0);
  const [children6to18, setCh18]    = useState(0);
  const [gender, setGender]         = useState("male");
  const [hasDegree, setDeg]         = useState(false);
  const [partnerWorks, setPartner]  = useState(false);
  const [miluimDays, setMiluim]     = useState(0);
  const [showAnnual, setShowAnn]    = useState(false);
  // benefit toggles
  const [inclIns, setInclIns]       = useState(true);
  const [companyCar, setCompanyCar] = useState(false);
  const [companyCarGroup, setCompanyCarGroup] = useState(3);
  const [inclSF, setInclSF]         = useState(true);
  const [inclPens, setInclPens]     = useState(true);
  const [inclRec, setInclRec]       = useState(true);
  const [inclCloth, setInclCloth]   = useState(true);
  const [inclGifts, setInclGifts]   = useState(true);
  const [inclLocality, setInclLocality]   = useState(false);
  const [selectedLocality, setSelectedLocality] = useState('');
  const [localitySearch, setLocalitySearch]     = useState('');

  const contract = CONTRACTS[contractId];

  useEffect(() => {
    setGradeId(contract.grades[Math.floor(contract.grades.length / 3)].id);
  }, [contractId]);

  const grade = useMemo(
    () => contract.grades.find(g => g.id === gradeId) || contract.grades[0],
    [contract, gradeId]
  );

  const nextGrade = useMemo(() => {
    const idx = contract.grades.findIndex(g => g.id === gradeId);
    if (idx < 0 || idx >= contract.grades.length - 1) return null;
    const hebrewLetters = 'אבגדהוזחטיכלמנסעפצקרשת';
    const curLabel = contract.grades[idx].label;
    const curSuffix = hebrewLetters.includes(curLabel.slice(-1)) ? curLabel.slice(-1) : '';
    for (let i = idx + 1; i < contract.grades.length; i++) {
      const g = contract.grades[i];
      const gSuffix = hebrewLetters.includes(g.label.slice(-1)) ? g.label.slice(-1) : '';
      if (gSuffix === curSuffix) return g;
    }
    return null;
  }, [contract, gradeId]);

  const params = {
    overtimeHours, carType, childrenUnder5, children6to18,
    gender, hasDegree, partnerWorks, miluimDays, insuranceCost,
    vehicleRegFee, travelAllowance,
    companyCar, companyCarGroup,
    includeInsuranceRefund: inclIns,
    includeStudyFund: inclSF,
    includePension: inclPens,
    includeRecovery: inclRec,
    includeClothing: inclCloth,
    includeGifts: inclGifts,
    localityGroupData: (inclLocality && selectedLocality && LOCALITY_MAP[selectedLocality])
      ? LOCALITY_GROUPS[String(LOCALITY_MAP[selectedLocality])]
      : null,
  };

  const R = useMemo(() => grade ? calcAll(grade.salary, contract, params) : null,
    [grade, contract, JSON.stringify(params)]);

  const NR = useMemo(() => nextGrade ? calcAll(nextGrade.salary, contract, params) : null,
    [nextGrade, contract, JSON.stringify(params)]);

  if (!R || !grade) return null;

  const cp = CAR_PACKAGES[carType];

  const sliderStyle = (val, max, color) => ({
    background: `linear-gradient(to left, ${color} 0%, ${color} ${(val/max)*100}%, #e2e8f0 ${(val/max)*100}%, #e2e8f0 100%)`
  });

  return (
    <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 p-3 md:p-6 pb-16 font-sans text-slate-800">
      <div className="max-w-7xl mx-auto space-y-6">

        {/* ── Header ── */}
        <header className="text-center pt-6 pb-2">
          <div className={`inline-flex items-center justify-center p-4 bg-gradient-to-br ${contract.color} rounded-3xl shadow-2xl mb-5 transition-all duration-500`}>
            <CalcIcon c="w-10 h-10 text-white" />
          </div>
          <h1 className="text-3xl md:text-4xl font-extrabold text-slate-900 mb-2">
            מחשבון שכר — שירות המדינה
          </h1>
          <p className="text-slate-500 text-base mb-3">
            עדכני לשנת 2026 • עדכון אפריל 2026 • חישוב מלא כולל ניכויים, מס ותנאים סוציאליים
          </p>
          {/* War disclaimer */}
          <div className="inline-flex items-center gap-2 bg-amber-50 border border-amber-200 rounded-xl px-4 py-2 mb-4 text-sm text-amber-800">
            <svg className="w-4 h-4 text-amber-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
            <span>המחשבון <strong>אינו כולל</strong> שינויים זמניים בשכר בעקבות המלחמה</span>
          </div>
          {/* About */}

              מחשבון זה נועד <strong className="text-slate-800">לפשט ולהנגיש את עולם השכר בשירות הציבורי</strong> — מגוון הדירוגים, הרכיבים והניכויים יכול להיות מורכב ובלתי שקוף. כאן תוכלו לקבל תמונה ברורה ומהירה של השכר נטו, ערך התפקיד הכלכלי והשוואה בין דירוגים — הכל במקום אחד, בצורה פשוטה וזמינה לכולם.
            </p>

          <div className="flex items-center justify-center gap-6 text-sm text-slate-500">

              // find which group the current contract belongs to

            const toggleGroup = (g) => setOpenGroups(prev => ({ ...prev, [g]: !prev[g] }));
