const CAR_PACKAGES = {
  "none":    { label: "ללא רכב", value: 0, isCar: false },
  "level2":  { label: "רכב שירות - רמה ב'", value: 1022, isCar: true, insurance: 444 },

// מחשב נקודות זיכוי למילואים
function calcMiluimPoints(days) {
  if (days < 30) return 0;
  if (days < 40) return 0.5;
  if (days < 50) return 0.75;
  const addPts = Math.floor((days - 50) / 5) * 0.25;
  return Math.min(1.0 + addPts, 4.0);
}

// ── קבועי שעות עבודה ──
// שבוע עבודה: 40 שעות × 52 שבועות ÷ 12 חודשים = 173.33 שעות/חודש
// (עדכון מ-182 ל-173.33 בהתאם לשבוע עבודה של 40 שעות)
const MONTHLY_HOURS = 173.33;

// מחשב מס הכנסה חודשי לפי מדרגות 2024
function calcIncomeTax(monthly) {
  // מדרגות מס הכנסה 2025 (רשות המסים)
  const brackets = [
    {up: 7010,  rate: 0.10},
    {up: 10060, rate: 0.14},
    {up: 19000, rate: 0.20},
    {up: 25100, rate: 0.31},
    {up: 46690, rate: 0.35},
    {up: 60317, rate: 0.47},
    {up: Infinity, rate: 0.50},
  ];
  let tax = 0, prev = 0;
  for (const b of brackets) {
    if (monthly <= prev) break;
    tax += (Math.min(monthly, b.up) - prev) * b.rate;
    prev = b.up;
  }
  return tax;
}

// ביטוח לאומי + בריאות (משולב כמו במקור)
function calcSocialSecurity(gross) {
  // ביטוח לאומי + ביטוח בריאות 2025
  // עד שכר מינימום (7,878 ₪): 3.5% + 3.1% בריאות = 6.6% → אך למדינה שיעור מופחת
  // מעל: 12% (7% ב"ל + 5% בריאות)
  const minWage = 7878;
  if (gross <= minWage) return gross * 0.0395;
  return (minWage * 0.0395) + ((gross - minWage) * 0.12);
}

function calcAll(baseSalary, contract, params) {
  const {
    overtimeHours, carType, childrenUnder5, children6to18, childrenAges,
    gender, hasDegree, partnerWorks, miluimDays, insuranceCost,
    vehicleRegFee, travelAllowance,
    companyCar, companyCarGroup,
    oncallCount, premiumHours, premiumPct,
    recoveryYears,
    includeInsuranceRefund, includeStudyFund, includePension,
    includeRecovery, includeClothing, includeGifts,
    inclMaonot,
    hasOvertimeEntitlement, // האם לדירוג יש זכאות לשעות נוספות (false = גלובלי)
  } = params;

  const cp = CAR_PACKAGES[carType];
  // ערך שעה: שכר בסיס ÷ 173.33 שעות (40ש' × 52 שבועות ÷ 12 חודשים)
  const hourlyRate = baseSalary / MONTHLY_HOURS;
  const ot125h = overtimeHours * (2/3);
  const ot150h = overtimeHours * (1/3);
  const overtimePay = (hourlyRate * 1.25 * ot125h) + (hourlyRate * 1.50 * ot150h);
  const travelPay = travelAllowance || 323;
  // זקיפת הטבה לרכב צמוד (נוסף לברוטו למס)
  const COMPANY_CAR_IMPUTATION = { 3: 4390, 4: 5260, 5: 7280 };
  const companyCarImputation = companyCar ? (COMPANY_CAR_IMPUTATION[companyCarGroup] || 0) : 0;
  // רכב צמוד מבטל רכב שירות וקצובת נסיעה
  const effectiveCarValue = companyCar ? 0 : cp.value;
  const effectiveTravelPay = companyCar ? 0 : travelPay;
  // כוננויות: כוננות = 5.33 שעות × ערך שעה
  const gradeHourlyRate = params.gradeHourlyRate || (baseSalary / MONTHLY_HOURS);
  const oncallPay = oncallCount * 5.33 * gradeHourlyRate;
  // פרמיה: שעות × אחוז × ערך שעה
  const premiumPay = premiumHours * (premiumPct / 100) * gradeHourlyRate;
  const carGross = effectiveCarValue + effectiveTravelPay;
  // מעונות: 330 ₪ לכל ילד עד גיל 4 (עד 2 ילדים)
  const childrenUnder5Count = childrenAges && childrenAges.length > 0
    ? childrenAges.filter(e => e.age <= 4).reduce((s, e) => s + (e.count || 1), 0)
    : (childrenUnder5 || 0);
  // מעונות: 330₪ לילד עד גיל 4 (עד 2), אלא אם משתמש ביטל (כי בן/בת זוג מקבל/ת)
  const maonotPay = (inclMaonot !== false && childrenUnder5Count > 0) ? (Math.min(childrenUnder5Count, 2) * 330) : 0;
  const totalGross = baseSalary + overtimePay + carGross + maonotPay + companyCarImputation + oncallPay + premiumPay;

  // נקודות זיכוי לפי גיל ילד ומגדר
  const CHILD_POINTS = (age, isMother) => {
    if (age === 0) return 2.5;
    if (age <= 2) return 4.5;
    if (age === 3) return 3.5;
    if (age <= 5) return 2.5;
    if (age <= 17) return isMother ? 2 : 1;
    if (age === 18) return isMother ? 0.5 : 0;
    return 0;
  };
  const isMother = gender === "female";
  let points = isMother ? 2.75 : 2.25;
  if (hasDegree) points += 1;
  // חישוב נקודות לפי גילאי ילדים (אם הוזן)
  if (childrenAges && childrenAges.length > 0) {
    childrenAges.forEach(({age, count}) => {
      points += CHILD_POINTS(age, isMother) * count;
    });
  } else {
    // fallback לשיטה הישנה
    points += childrenUnder5 * 2.5;
    points += children6to18 * (isMother ? 2 : 1);
  }
  const miluimPoints = calcMiluimPoints(miluimDays);
  points += miluimPoints;
  const taxCreditValue = points * 250; // נקודת זיכוי 2025 — 250 ₪/חודש

  // מס הכנסה
  let incomeTax = Math.max(0, calcIncomeTax(totalGross) - taxCreditValue);

  // ביטוח לאומי + בריאות
  const socialSecurity = calcSocialSecurity(totalGross);

  // ── השכר הקובע לצורך הפרשות פנסיוניות ──
  // כולל: שכר בסיס + שעות נוספות (מדווחות — לפי חוק הגנת השכר)
  // מוחרגים: כוננויות, פרמיה, החזרי הוצאות (נסיעות, ביגוד, הבראה, מעונות)
  // חריג גלובלי: חוזה ללא זכאות שעות נוספות = שכר הבסיס כולל הכל (כבר בסיסי)
  const isGlobalContract = hasOvertimeEntitlement === false && baseSalary > 0;
  // שעות נוספות מדווחות — פנסיוניות לפי חוק הגנת השכר (לא כוננויות ולא פרמיה)
  const pensionableSalary = baseSalary + overtimePay;
  // הערה: כוננויות, פרמיה, maonotPay, carGross, recoveryPay, clothing — מוחרגים

  // ניכויי עובד (מהשכר הקובע בלבד)
  const pensionDed = pensionableSalary * contract.pensionEmployee;
  const studyFundDed = pensionableSalary * contract.studyFundEmployee;
  const unionDues = 50;
  const totalDeductions = incomeTax + socialSecurity + pensionDed + studyFundDed + unionDues;
  const netSalary = totalGross - totalDeductions;

  // הפרשות מעסיק (מהשכר הקובע בלבד)
  const studyFundEmployer = pensionableSalary * contract.studyFundEmployer;
  const pensionEmployer = pensionableSalary * contract.pensionEmployer;

  // הטבות נוספות
  // הבראה: 350 ₪ ליום (מיוני 2023), מספר ימים לפי ותק
  const RECOVERY_DAY_RATE = 374; // שיעור יומי הבראה 2025
  function calcRecoveryDays(years) {
    if (years < 1)  return 5;
    if (years < 2)  return 5;
    if (years < 4)  return 6;
    if (years < 11) return 7;
    if (years < 16) return 8;
    if (years < 20) return 9;
    if (years < 25) return 12;
    return 12;
  }
  const recoveryDays = calcRecoveryDays(recoveryYears || 0);
  const recoveryPay = (recoveryDays * RECOVERY_DAY_RATE) / 12;  // חודשי

  const clothing = 206; // ביגוד — מעודכן
  const gifts = 100;
  const cibus = 30 * 20;  // סיבוס — 30 ₪ × 20 ימי עבודה
  const phone = 130;      // קו + מכשיר סלולר
  const insuranceRefundMonthly = (cp.isCar && !companyCar) ? Math.min(insuranceCost, 7000) / 12 : 0;
  const regFeeRefundMonthly = (cp.isCar && !companyCar) ? Math.min(vehicleRegFee || 0, 2326) / 12 : 0;

  let totalEconomicValue = netSalary;
  if (includeInsuranceRefund) totalEconomicValue += insuranceRefundMonthly + regFeeRefundMonthly;
  if (includeStudyFund) totalEconomicValue += studyFundEmployer;
  if (includePension) totalEconomicValue += pensionEmployer;
  if (includeRecovery) totalEconomicValue += recoveryPay;
  if (includeClothing) totalEconomicValue += clothing;
  if (includeGifts) totalEconomicValue += gifts;
  if (params.inclCibus) totalEconomicValue += cibus;
  if (params.inclPhone) totalEconomicValue += phone;

  return {
    baseSalary, pensionableSalary, isGlobalContract, overtimePay, ot125h, ot150h, carGross, maonotPay,
    totalGross, points, miluimPoints, taxCreditValue,
    incomeTax, socialSecurity, pensionDed, studyFundDed, unionDues,
    totalDeductions, netSalary, insuranceRefundMonthly, regFeeRefundMonthly,
    studyFundEmployer, pensionEmployer, totalEconomicValue, cibus, phone,
    hourlyRate: gradeHourlyRate, recoveryPay, recoveryDays, clothing, gifts, travelAllowance,
    companyCarImputation, oncallPay, premiumPay,
  };
}

          <button onClick={() => setSearch('')} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">✕</button>
        )}

      {/* Search results */}
      {searchResults && (

      {!searchResults && Object.entries(CONTRACT_GROUPS).map(([groupName, ids]) => {
        const isOpen = openGroups[groupName];
        const hasActive = ids.includes(contractId);

const ChildrenInput = ({ childrenAges, setChildrenAges, gender }) => {
  const [showAgeInput, setShowAgeInput] = React.useState(false);
  const [newAge, setNewAge] = React.useState(0);
  const [newCount, setNewCount] = React.useState(1);

  const addChild = () => {
    const age = Number(newAge);
    if (age < 0 || age > 18) return;
    const existing = childrenAges.find(c => c.age === age);
    if (existing) {
      setChildrenAges(childrenAges.map(c => c.age === age ? {...c, count: c.count + newCount} : c));
    } else {
      setChildrenAges([...childrenAges, {age, count: newCount}].sort((a,b) => a.age - b.age));
    }
    setShowAgeInput(false);
  };
  const removeChild = (age) => setChildrenAges(childrenAges.filter(c => c.age !== age));
  const CHILD_POINTS_UI = (age) => {
    const isMother = gender === "female";
    if (age === 0) return 2.5; if (age <= 2) return 4.5; if (age === 3) return 3.5;
    if (age <= 5) return 2.5; if (age <= 17) return isMother ? 2 : 1;
    if (age === 18) return isMother ? 0.5 : 0; return 0;
  };
  return (
    <div className="mb-4">
      <div className="flex items-center justify-between mb-2">
        <label className="text-sm font-semibold text-slate-700">ילדים — נקודות זיכוי לפי גיל</label>
        <button onClick={() => setShowAgeInput(!showAgeInput)}
          className="text-xs bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg transition-all font-semibold">
          + הוסף ילד
        </button>
      </div>
      {showAgeInput && (
        <div className="bg-blue-50 border-2 border-blue-200 rounded-xl p-3 mb-2 flex items-end gap-2">
          <div className="flex-1">
            <label className="text-xs text-slate-600 mb-1 block">גיל הילד (0–18)</label>
            <input type="number" min="0" max="18" value={newAge} onChange={e => setNewAge(Number(e.target.value))}
              className="w-full border-2 border-blue-300 rounded-lg px-3 py-2 text-center font-bold text-lg focus:ring-2 focus:ring-blue-500" />
          </div>
          <div className="w-20">
            <label className="text-xs text-slate-600 mb-1 block">כמות</label>
            <input type="number" min="1" max="5" value={newCount} onChange={e => setNewCount(Number(e.target.value))}
              className="w-full border-2 border-blue-300 rounded-lg px-3 py-2 text-center font-bold text-lg focus:ring-2 focus:ring-blue-500" />
          </div>
          <button onClick={addChild} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-bold transition-all">✓</button>
          <button onClick={() => setShowAgeInput(false)} className="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-lg transition-all">✕</button>
        </div>
      )}
      {childrenAges.length > 0 ? (
        <div className="space-y-1.5">
          {childrenAges.map(({age, count}) => {
            const pts = CHILD_POINTS_UI(age) * count;
            return (
              <div key={age} className="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">
                <div className="flex items-center gap-2">
                  <button onClick={() => removeChild(age)} className="text-slate-400 hover:text-red-500 transition-all text-lg leading-none">×</button>
                  <span className="text-sm font-medium text-slate-700">{count > 1 ? `${count}× ` : ""}גיל {age}</span>
                </div>
                <span className="text-sm font-bold text-emerald-700">{pts} נק׳</span>
              </div>
            );
          })}
          <div className="text-xs text-slate-500 text-center pt-1">* נקודות לפי מגדר ({gender === "female" ? "אישה" : "גבר"})</div>
        </div>
      ) : (
        <div className="text-center py-4 text-slate-400 text-sm border-2 border-dashed border-slate-200 rounded-xl">לחץ "+ הוסף ילד" להזנת גיל ילדיך</div>
      )}
    </div>
  );
};


const OncallPremiumCard = ({ R, contractId, entitlements, oncallCount, setOncall, premiumHours, premiumPct, setPremHours, setPremPct, sliderStyle }) => {
  const [oncallOpen, setOncallOpen]   = React.useState(false);
  const [premOpen,   setPremOpen]     = React.useState(false);
  const [oncallEligible, setOncallEl] = React.useState(entitlements.oncall ? null : false);
  const [premEligible,   setPremEl]   = React.useState(null);
  React.useEffect(() => { setOncallEl(entitlements.oncall ? null : false); setOncallOpen(false); }, [contractId]);

  const Tab = ({color, dot, title, sub, eligible, setEl, open, setOpen, children}) => (
    <div className={`rounded-2xl border-2 transition-all ${open && eligible ? `border-${color}-300 bg-${color}-50` : "border-slate-200 bg-white"}`}>
      <div className="p-4">
        <div className="flex items-center gap-2 mb-3">
          <div className={`w-2.5 h-2.5 rounded-full bg-${dot}-500`}></div>
          <span className="font-bold text-slate-800 text-sm">{title}</span>
          <span className="text-xs text-slate-400 mr-auto">{sub}</span>
          {eligible && (
            <button onClick={() => setOpen(!open)}
              className={`text-xs px-3 py-1 rounded-full font-semibold transition-all ${open ? `bg-${color}-500 text-white` : `bg-${color}-100 text-${color}-700 hover:bg-${color}-200`}`}>
              {open ? "סגור ▲" : "הזן ▼"}
            </button>
          )}
        </div>
        {eligible === null && (
          <div className="bg-slate-50 rounded-xl p-3 border border-slate-200">
            <p className="text-xs text-slate-600 mb-2 font-medium">האם בחוזה שלך יש {title}?</p>
            <div className="flex gap-2">
              <button onClick={() => { setEl(true); setOpen(true); }}
                className={`flex-1 py-2 rounded-xl text-sm font-bold border-2 bg-${color}-50 border-${color}-300 text-${color}-700 hover:bg-${color}-100 transition-all`}>✓ כן, יש לי</button>
              <button onClick={() => { setEl(false); setOpen(false); }}
                className="flex-1 py-2 rounded-xl text-sm font-bold border-2 border-slate-200 text-slate-500 hover:bg-slate-100 transition-all">✗ לא רלוונטי</button>
            </div>
          </div>
        )}
        {eligible === false && title === "כוננויות" && !entitlements.oncall && (
          <div className="text-xs text-slate-400 bg-slate-50 rounded-lg px-3 py-2">🚫 דירוג {contractId} אינו זכאי לכוננויות לפי נספח א׳</div>
        )}
        {eligible === false && (title !== "כוננויות" || entitlements.oncall) && (
          <div className="flex items-center gap-2">
            <span className="text-xs text-slate-400">לא נכלל בחישוב</span>
            <button onClick={() => setEl(null)} className="text-xs text-blue-500 hover:underline">שנה</button>
          </div>
        )}
        {eligible === true && !open && (
          <div className="flex items-center gap-2 flex-wrap">
            {title === "כוננויות" && oncallCount > 0 && <span className="text-xs font-bold text-violet-600">+{Math.round(R.oncallPay).toLocaleString()} ₪ ({oncallCount} כוננויות)</span>}
            {title === "פרמיה" && R.premiumPay > 0 && <span className="text-xs font-bold text-emerald-600">+{Math.round(R.premiumPay).toLocaleString()} ₪</span>}
            {((title === "כוננויות" && oncallCount === 0) || (title === "פרמיה" && (premiumHours === 0 || premiumPct === 0))) && <span className="text-xs text-slate-400">לחץ "הזן" להוסיף ערכים</span>}
            <button onClick={() => { setEl(null); setOpen(false); }} className="text-xs text-slate-400 hover:text-red-500 underline mr-auto transition-colors">ביטול</button>
          </div>
        )}
      </div>
      {eligible && open && <div className="px-4 pb-4 border-t border-slate-100 pt-4">{children}</div>}
    </div>
  );

  return (
    <Card className="p-5 space-y-3">
      <SectionTitle icon={Ico.Brief} title="כוננויות ופרמיה" subtitle="תוספות מיוחדות — לפי זכאות בחוזה" />
      <Tab color="violet" dot="violet" title="כוננויות" sub="כוננות = 5.33 שעות × ערך שעה"
        eligible={oncallEligible} setEl={setOncallEl} open={oncallOpen} setOpen={setOncallOpen}>
        <p className="text-xs text-slate-500 mb-3">כוננות = 5.33ש׳ × {R.hourlyRate.toFixed(2)} ₪ = <strong className="text-violet-700">{(5.33*R.hourlyRate).toFixed(2)} ₪</strong></p>
        <div className="flex items-center gap-3 mb-2">
          <input type="range" min="0" max="16" value={oncallCount} onChange={e => setOncall(Number(e.target.value))}
            className="flex-1 h-3 rounded-full appearance-none cursor-pointer" style={sliderStyle(oncallCount,16,"#8b5cf6")} />
          <span className="w-16 text-center font-mono bg-gradient-to-br from-violet-500 to-purple-600 text-white py-2 px-2 rounded-xl font-bold text-xl shadow">{oncallCount}</span>
        </div>
        <div className="flex justify-between text-xs text-slate-400 px-1 mb-3"><span>0</span><span>4</span><span>8</span><span>12</span><span>16</span></div>
        {oncallCount > 0 ? (
          <div className="bg-violet-50 border border-violet-200 rounded-xl p-3 text-sm">
            <div className="flex justify-between font-semibold">
              <span>{oncallCount} כוננויות × {(5.33*R.hourlyRate).toFixed(2)} ₪</span>
              <span className="text-violet-700">+{Math.round(R.oncallPay).toLocaleString()} ₪</span>
            </div>
          </div>
        ) : <div className="text-center text-xs text-slate-400 py-2 border border-dashed border-slate-200 rounded-xl">הזז את המחוון</div>}
      </Tab>
      <Tab color="emerald" dot="emerald" title="פרמיה" sub="תמריץ תפוקה ליחידות מדודות"
        eligible={premEligible} setEl={setPremEl} open={premOpen} setOpen={setPremOpen}>
        <p className="text-xs text-slate-500 mb-3">שעות × יעילות% × {R.hourlyRate.toFixed(2)} ₪/שעה</p>
        <div className="grid grid-cols-2 gap-3 mb-3">
          <div>
            <label className="text-xs font-semibold text-slate-600 mb-1.5 block">שעות עבודה בפועל</label>
            <input type="number" min="0" max="250" value={premiumHours} onChange={e => setPremHours(Math.min(Number(e.target.value),250))}
              className="w-full bg-white border-2 border-slate-200 py-3 px-3 rounded-xl text-center font-bold text-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" />
          </div>
          <div>
            <label className="text-xs font-semibold text-slate-600 mb-1.5 block">אחוז יעילות (0–30%)</label>
            <div className="relative">
              <input type="number" min="0" max="30" value={premiumPct} onChange={e => setPremPct(Math.min(Number(e.target.value),30))}
                className="w-full bg-white border-2 border-slate-200 py-3 pr-3 pl-8 rounded-xl text-center font-bold text-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" />
              <span className="absolute left-3 top-3.5 text-slate-400 font-bold">%</span>
            </div>
          </div>
        </div>
        {premiumHours > 0 && premiumPct > 0 ? (
          <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-sm">
            <div className="flex justify-between font-semibold">
              <span>{premiumHours}ש׳ × {premiumPct}% × {R.hourlyRate.toFixed(2)} ₪</span>
              <span className="text-emerald-700">+{Math.round(R.premiumPay).toLocaleString()} ₪</span>
            </div>
          </div>
        ) : <div className="text-center text-xs text-slate-400 py-2 border-2 border-dashed border-slate-200 rounded-xl">הזן שעות ואחוז יעילות</div>}
      </Tab>
    </Card>
  );
};

              <div><span className="text-gray-400">ברוטו ב.לאומי: </span><span className="font-semibold">{fmt(R.totalGross)} ₪</span></div>

          </div>

          <div className="mx-4 mb-3 text-center text-xs text-gray-400 border-t border-gray-200 pt-2">
            * תלוש זה הוא <strong>סימולציה בלבד</strong> לצרכי תכנון | מבוסס על נתוני 2024–2025

        <div className="no-print px-4 pb-4 flex gap-3 justify-center border-t border-gray-100 pt-3">
          <button onClick={()=>{
                  // Temporarily override body display for print
                  const style = document.createElement('style');

                  style.innerHTML = 'body>*{display:none!important}#ps-root{display:block!important;position:static!important;overflow:visible!important;background:white!important;height:auto!important}#ps-root .fixed{position:static!important}#ps-root .bg-black\/70{background:none!important;position:static!important}.no-print{display:none!important}';
                  document.head.appendChild(style);
                  window.print();
                  setTimeout(()=>{const el=document.getElementById('print-override');if(el)el.remove();},1000);
                }} className="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-sm transition-all shadow-md">🖨 הדפס / שמור PDF</button>
          <button onClick={onClose} className="px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-sm transition-all">✕ סגור</button>
        </div>
      </div>
    </div>
  );
};


const StickyContactBar = ({ contract }) => {
  const [atBottom, setAtBottom] = React.useState(false);
  React.useEffect(() => {
    const onScroll = () => {
      const anchor = document.getElementById('contact-anchor');
      if (anchor) {
        const rect = anchor.getBoundingClientRect();
        setAtBottom(rect.top < window.innerHeight);
      }
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

                </div>

                <BenefitToggle label="דמי ביגוד (206 ₪/חודש)" sub="עדכון 2024" value={R.clothing} checked={inclCloth} onChange={setInclCloth} />
                <BenefitToggle label="מתנות לחגים" value={R.gifts} checked={inclGifts} onChange={setInclGifts} />
                <BenefitToggle label="סיבוס (30 ₪ × 20 ימים)" sub="ארוחות בעבודה — שווי חודשי" value={R.cibus} checked={inclCibus} onChange={setInclCibus} icon={Ico.Coin} />
                <BenefitToggle label="קו + מכשיר סלולר" sub="ערך חודשי משוערך" value={R.phone} checked={inclPhone} onChange={setInclPhone} icon={Ico.Card} />

                <div className="mt-4 p-4 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-xl text-white">
                  <div className="flex items-center justify-between">
                    <div>
                      <div className="text-emerald-100 text-sm mb-1">שווי כלכלי כולל</div>
                      <div className="text-3xl font-bold">{Math.round(R.totalEconomicValue).toLocaleString()} ₪</div>
                      <div className="text-emerald-100 text-xs mt-1">לחודש (לפי הבחירה שלך)</div>
                    </div>
                    <Ico.Trend c="w-16 h-16 text-emerald-200 opacity-40" />
                  </div>
                </div>
              </div>
            </Card>

            {/* Promotion Comparison */}
            {nextGrade && NR && (
              <div className="bg-gradient-to-br from-amber-50 to-orange-50 rounded-xl p-5 border border-amber-200">
                <h4 className="font-bold text-slate-800 mb-4 flex items-center gap-2">
                  <Ico.Trend c="w-5 h-5 text-amber-600" />
                  מה קורה בקידום לדרגה הבאה?
                </h4>
                <div className="space-y-2">
                  <div className="flex justify-between items-center">
                    <span className="text-sm text-slate-600">דרגה נוכחית ({grade.label})</span>
                    <span className="font-bold">{Math.round(R.netSalary).toLocaleString()} ₪</span>
                  </div>
                  <div className="flex justify-between items-center">
                    <span className="text-sm text-slate-600">דרגה הבאה ({nextGrade.label})</span>
                    <span className="font-bold text-emerald-600">{Math.round(NR.netSalary).toLocaleString()} ₪</span>
                  </div>
                  <div className="pt-3 border-t border-amber-200 flex justify-between items-center">
                    <span className="text-sm font-semibold text-amber-700">עלייה צפויה</span>
                    <div className="text-left">
                      <div className="font-bold text-emerald-600">+{Math.round(NR.netSalary - R.netSalary).toLocaleString()} ₪</div>
                      <div className="text-xs text-slate-500">+{(((NR.netSalary - R.netSalary) / R.netSalary) * 100).toFixed(1)}% | שנתי: +{Math.round((NR.netSalary - R.netSalary)*12).toLocaleString()} ₪</div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Annual Summary */}
            <Card className="p-6 bg-gradient-to-br from-violet-50 to-purple-50 border-violet-200">
              <SectionTitle icon={Ico.Cal} title="סיכום שנתי" subtitle="תחשיב להכנסה שנתית" />
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {[
                  {label:"נטו שנתי (12 חודשים)", val:R.netSalary*12, clr:"text-violet-700", bg:"border-violet-200"},
                  {label:"שווי כלכלי שנתי", val:R.totalEconomicValue*12, clr:"text-emerald-600", bg:"border-emerald-200"},
                  {label:"חיסכון שנתי לפנסיה", val:(R.pensionDed+R.pensionEmployer)*12, clr:"text-blue-600", bg:"border-blue-200", sub:"עובד + מעסיק"},
                  {label:"חיסכון שנתי לקה״ש", val:(R.studyFundDed+R.studyFundEmployer)*12, clr:"text-indigo-600", bg:"border-indigo-200", sub:"עובד + מעסיק"},
                ].map((s,i) => (
                  <div key={i} className={`bg-white rounded-xl p-5 border-2 ${s.bg}`}>
                    <div className="text-sm text-slate-600 mb-1">{s.label}</div>
                    <div className={`text-3xl font-bold ${s.clr}`}>{Math.round(s.val).toLocaleString()} ₪</div>
                    {s.sub && <div className="text-xs text-slate-500 mt-1">{s.sub}</div>}
                  </div>
                ))}
              </div>
            </Card>

          </div>
        </div>

        {/* Footer */}
        <div className="text-center py-6 text-sm text-slate-500 space-y-1">
          <p>💡 המחשבון מבוסס על נתוני עדכון ינואר 2024 (מדד 2.96%) ומספק הערכה כללית | {Object.keys(CONTRACTS).length} דירוגים זמינים</p>
          <p>לחישוב מדויק יש להתייעץ עם מחלקת משאבי אנוש</p>
        </div>


      {/* Payslip Modal */}
      {showPayslip && R && (
        <PayslipModal R={R} contract={contract} grade={grade} contractId={contractId}
          params={params} recoveryYears={recoveryYears} onClose={() => setShowPayslip(false)} />
      )}


      {/* ── Contact Card (anchor at bottom) ── */}
      <div id="contact-anchor" className="max-w-7xl mx-auto mb-4">
        <div className={`bg-gradient-to-br ${contract.color} rounded-2xl shadow-xl overflow-hidden`}>
          <div className="px-6 py-5 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div className="text-white text-right">
              <div className="text-base font-extrabold mb-0.5">יהודה סעדיה</div>
              <div className="text-xs opacity-75">יוצר המחשבון • לשאלות, הצעות ושיתופי פעולה</div>
            </div>
            <div className="flex flex-wrap items-center justify-center gap-2">
              <a href="mailto:yehoda.sadaay@gmail.com"
                className="flex items-center gap-2 bg-white/15 hover:bg-white/25 transition-all rounded-xl px-3 py-2 text-white">
                <div className="w-7 h-7 rounded-lg bg-white/20 flex items-center justify-center flex-shrink-0">
                  <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                  </svg>
                </div>
                <div className="text-right">
                  <div className="text-xs opacity-70 leading-none mb-0.5">מייל</div>
                  <div className="text-xs font-semibold leading-none">yehoda.sadaay@gmail.com</div>
                </div>
              </a>
              <a href="tel:0506202972"
                className="flex items-center gap-2 bg-white/15 hover:bg-white/25 transition-all rounded-xl px-3 py-2 text-white">
                <div className="w-7 h-7 rounded-lg bg-white/20 flex items-center justify-center flex-shrink-0">
                  <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                  </svg>
                </div>
                <div className="text-right">
                  <div className="text-xs opacity-70 leading-none mb-0.5">טלפון</div>
                  <div className="text-xs font-semibold leading-none" dir="ltr">050-620-2972</div>
                </div>
              </a>
              <a href="https://linkedin.com/in/יהודה-סעדיה-628161214" target="_blank" rel="noopener noreferrer"
                className="flex items-center gap-2 bg-white/15 hover:bg-white/25 transition-all rounded-xl px-3 py-2 text-white">
                <div className="w-7 h-7 rounded-lg bg-white/20 flex items-center justify-center flex-shrink-0">
                  <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                  </svg>
                </div>
                <div className="text-right">
                  <div className="text-xs opacity-70 leading-none mb-0.5">לינקדין</div>
                  <div className="text-xs font-semibold leading-none">יהודה סעדיה</div>
                </div>
              </a>
            </div>
          </div>
        </div>
      </div>

      {/* ── Sticky Bar ── */}
      <StickyContactBar contract={contract} />


    </div>
  </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<SalaryCalculator />);
