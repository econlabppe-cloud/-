// מחשב נקודות זיכוי למילואים
function calcMiluimPoints(days) {
  if (days < 30) return 0;
  if (days < 40) return 0.5;
  if (days < 50) return 0.75;
  const addPts = Math.floor((days - 50) / 5) * 0.25;
  return Math.min(1.0 + addPts, 4.0);
}

// מחשב מס הכנסה חודשי לפי מדרגות 2024
function calcIncomeTax(monthly) {
  const brackets = [
    {up: 7010,  rate: 0.10},
    {up: 10060, rate: 0.14},
    {up: 16150, rate: 0.20},
    {up: 22440, rate: 0.31},
    {up: 46690, rate: 0.35},
    {up: 60130, rate: 0.47},
    {up: Infinity, rate: 0.50},
  ];
  let tax = 0, prev = 0;
  for (const b of brackets) {
    if (monthly <= prev) break;
    tax += (Math.min(monthly, b.up) - prev) * b.rate;
    prev = b.up;
  }
  return tax;
}

// ביטוח לאומי + בריאות (משולב כמו במקור)
function calcSocialSecurity(gross) {
  if (gross <= 7522) return gross * 0.0395;
  return (7522 * 0.0395) + ((gross - 7522) * 0.12);
}

function calcAll(baseSalary, contract, params) {
  const {
    overtimeHours, carType, childrenUnder5, children6to18,
    gender, hasDegree, partnerWorks, miluimDays, insuranceCost,
    vehicleRegFee, travelAllowance,
    companyCar, companyCarGroup,
    includeInsuranceRefund, includeStudyFund, includePension,
    includeRecovery, includeClothing, includeGifts,
  } = params;

  const cp = CAR_PACKAGES[carType];
  const hourlyRate = baseSalary / 182;
  const ot125h = overtimeHours * (2/3);
  const ot150h = overtimeHours * (1/3);
  const overtimePay = (hourlyRate * 1.25 * ot125h) + (hourlyRate * 1.50 * ot150h);
  const travelPay = travelAllowance || 323;
  // זקיפת הטבה לרכב צמוד (נוסף לברוטו למס)
  const COMPANY_CAR_IMPUTATION = { 3: 4390, 4: 5260, 5: 7280 };
  const companyCarImputation = companyCar ? (COMPANY_CAR_IMPUTATION[companyCarGroup] || 0) : 0;
  const carGross = cp.value + travelPay; // חבילת רכב שירות + קצובת נסיעה
  const maonotPay = (partnerWorks && childrenUnder5 > 0) ? (Math.min(childrenUnder5, 2) * 330) : 0;
  const totalGross = baseSalary + overtimePay + carGross + maonotPay + companyCarImputation;

  // נקודות זיכוי
  let points = gender === "female" ? 2.75 : 2.25;
  if (hasDegree) points += 1;
  points += childrenUnder5 * 2.5;
  points += children6to18 * 1;
  const miluimPoints = calcMiluimPoints(miluimDays);
  points += miluimPoints;
  const taxCreditValue = points * 242;

  // מס הכנסה
  let incomeTax = Math.max(0, calcIncomeTax(totalGross) - taxCreditValue);

  // ביטוח לאומי + בריאות
  const socialSecurity = calcSocialSecurity(totalGross);

  // ניכויי עובד
  const pensionDed = baseSalary * contract.pensionEmployee;
  const studyFundDed = baseSalary * contract.studyFundEmployee;
  const unionDues = 50;
  const totalDeductions = incomeTax + socialSecurity + pensionDed + studyFundDed + unionDues;
  const netSalary = totalGross - totalDeductions;

  // הפרשות מעסיק
  const studyFundEmployer = baseSalary * contract.studyFundEmployer;
  const pensionEmployer = baseSalary * contract.pensionEmployer;

  // הטבות נוספות
  const recoveryPay = 350;
  const clothing = 125;
  const gifts = 100;
  const insuranceRefundMonthly = cp.isCar ? Math.min(insuranceCost, 7000) / 12 : 0;
  const regFeeRefundMonthly = cp.isCar ? Math.min(vehicleRegFee || 0, 2326) / 12 : 0;

  let totalEconomicValue = netSalary;
  if (includeInsuranceRefund) totalEconomicValue += insuranceRefundMonthly + regFeeRefundMonthly;
  if (includeStudyFund) totalEconomicValue += studyFundEmployer;
  if (includePension) totalEconomicValue += pensionEmployer;
  if (includeRecovery) totalEconomicValue += recoveryPay;
  if (includeClothing) totalEconomicValue += clothing;
  if (includeGifts) totalEconomicValue += gifts;

  return {
    baseSalary, overtimePay, ot125h, ot150h, carGross, maonotPay,
    totalGross, points, miluimPoints, taxCreditValue,
    incomeTax, socialSecurity, pensionDed, studyFundDed, unionDues,
    totalDeductions, netSalary, insuranceRefundMonthly, regFeeRefundMonthly,
    studyFundEmployer, pensionEmployer, totalEconomicValue,
    hourlyRate, recoveryPay, clothing, gifts, travelAllowance,
    companyCarImputation,
  };
}

              {/* Deductions */}
              <div className="bg-gradient-to-br from-red-50 to-rose-50 rounded-xl p-4 border border-red-200 mb-4">

                  </svg>
                </div>
                <div className="text-right">
                  <div className="text-xs opacity-70 leading-none mb-0.5">לינקדין</div>
                  <div className="text-xs font-semibold leading-none">יהודה סעדיה</div>
                </div>
              </a>
            </div>
          </div>
        </div>
      </div>

      {/* ── Sticky Credit Bar with contact icons ── */}
      {(() => {
        const [atBottom, setAtBottom] = React.useState(false);
        React.useEffect(() => {
          const check = () => {
            const anchor = document.getElementById('contact-anchor');
            if (anchor) {
              const rect = anchor.getBoundingClientRect();
              setAtBottom(rect.top < window.innerHeight - 10);
            }
          };
          window.addEventListener('scroll', check, { passive: true });
          window.addEventListener('resize', check);
          check();

        }, []);

        return (

            className={`fixed bottom-0 left-0 right-0 z-50 ${atBottom ? 'opacity-0 pointer-events-none translate-y-2' : 'opacity-100 translate-y-0'}`}>

              <div className="max-w-7xl mx-auto px-4 py-2 flex items-center justify-between gap-3">
                {/* Left: branding */}
                <div className="flex items-center gap-2.5">
                  <div className="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center flex-shrink-0">
                    <CalcIcon c="w-4 h-4 text-white" />

                    className="w-8 h-8 rounded-lg bg-white/15 hover:bg-white/30 flex items-center justify-center transition-all group relative">
                    <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>

                    </svg>
                    <span className="absolute bottom-10 left-1/2 -translate-x-1/2 bg-black/80 text-white text-xs rounded px-2 py-1 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">050-620-2972</span>
                  </a>
                  <a href="https://linkedin.com/in/יהודה-סעדיה-628161214" target="_blank" rel="noopener noreferrer" title="LinkedIn"
                    className="w-8 h-8 rounded-lg bg-white/15 hover:bg-white/30 flex items-center justify-center transition-all group relative">
                    <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
                      <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                    </svg>
                    <span className="absolute bottom-10 left-1/2 -translate-x-1/2 bg-black/80 text-white text-xs rounded px-2 py-1 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">LinkedIn</span>
                  </a>
                  <div className="h-5 w-px bg-white/20 mx-1" />
                  <div className="text-white/80 text-xs">

              </div>

          </div>

    </div>

}
