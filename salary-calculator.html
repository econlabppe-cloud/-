<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון שכר כלכלנים - דירוג 402</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Heebo', sans-serif;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.5);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.5);
            border: none;
        }
        
        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // SVG Icons as React components
        const Calculator = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
            </svg>
        );

        const Car = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2" />
            </svg>
        );

        const Baby = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
        );

        const Coins = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
        );

        const Info = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const Briefcase = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
        );

        const CreditCard = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
            </svg>
        );

        const TrendingUp = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
        );

        const CheckCircle = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const ChevronDown = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
            </svg>
        );

        const PiggyBank = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
        );

        const Calendar = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
        );

        const FileText = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
        );

        const Zap = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
        );

        // נתוני שכר דירוג 402
        const RANK_SALARIES = {
            "36": 8264.16,
            "36א": 8764.16,
            "37": 8861.30,
            "37א": 9361.30,
            "38": 9819.78,
            "38א": 10319.78,
            "39": 10631.57,
            "39א": 11131.57,
            "40": 12281.86,
            "40א": 12781.86,
            "41": 14224.50,
            "41א": 14724.50,
            "42": 15679.44,
            "42א": 16179.44,
            "43": 17293.07,
            "43א": 17793.07,
            "44": 19437.16,
            "44א": 19937.16
        };

        const CAR_PACKAGES = {
            "none": { label: "ללא רכב (חופשי חודשי)", value: 226, isCar: false },
            "level3": { label: "רכב אישי - רמה 3 (רגיל)", value: 1300, isCar: true, insurance: 550 },
            "level3_service": { label: "רכב אישי - רמה ג' (תנאי שירות)", value: 1750, isCar: true, insurance: 550 },
            "level4_service": { label: "רכב אישי - רמה ד' (תנאי שירות)", value: 2100, isCar: true, insurance: 550 }
        };

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden transition-all hover:shadow-xl ${className}`}>
                {children}
            </div>
        );

        const SectionTitle = ({ icon: Icon, title, subtitle }) => (
            <div className="mb-6">
                <div className="flex items-center gap-3 mb-1">
                    <div className="p-2 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-lg">
                        <Icon className="w-5 h-5 text-white" />
                    </div>
                    <span className="text-lg font-bold text-slate-800">{title}</span>
                </div>
                {subtitle && <p className="text-sm text-slate-500 mr-12">{subtitle}</p>}
            </div>
        );

        const InputGroup = ({ label, children, subLabel = null, icon: Icon }) => (
            <div className="mb-5">
                <label className="flex items-center gap-2 text-sm font-semibold text-slate-700 mb-2">
                    {Icon && <Icon className="w-4 h-4 text-slate-400" />}
                    {label}
                </label>
                {children}
                {subLabel && <p className="text-xs text-slate-500 mt-2 mr-6">{subLabel}</p>}
            </div>
        );

        const ResultRow = ({ label, value, subValue = null, highlight = false, isNegative = false, icon: Icon }) => (
            <div className={`flex justify-between items-center py-3 px-4 rounded-lg transition-all ${
                highlight 
                    ? 'bg-gradient-to-l from-blue-50 to-transparent border-r-4 border-blue-500 font-semibold' 
                    : 'hover:bg-slate-50'
            }`}>
                <div className="flex items-center gap-2">
                    {Icon && <Icon className="w-4 h-4 text-slate-400" />}
                    <div>
                        <span className={`${highlight ? 'font-bold text-slate-800' : 'text-slate-600'}`}>{label}</span>
                        {subValue && <div className="text-xs text-slate-400 mt-0.5">{subValue}</div>}
                    </div>
                </div>
                <div className={`font-bold font-mono text-lg ${
                    isNegative ? 'text-red-600' : (highlight ? 'text-blue-700' : 'text-slate-800')
                }`}>
                    {isNegative && '−'}{value.toLocaleString('he-IL', { maximumFractionDigits: 0 })} ₪
                </div>
            </div>
        );

        const StatCard = ({ icon: Icon, label, value, subValue, gradient, className = "", onClick }) => (
            <div 
                className={`${gradient} rounded-2xl p-6 text-white shadow-lg relative overflow-hidden group ${className} ${onClick ? 'cursor-pointer' : ''}`}
                onClick={onClick}
            >
                <div className="absolute -bottom-4 -left-4 opacity-10 group-hover:scale-110 transition-transform duration-300">
                    <Icon className="w-32 h-32" />
                </div>
                <div className="relative z-10">
                    <div className="flex items-center gap-2 mb-2">
                        <Icon className="w-5 h-5 opacity-80" />
                        <h3 className="font-medium text-sm opacity-90">{label}</h3>
                    </div>
                    <div className="text-4xl font-bold tracking-tight mb-2">
                        {value.toLocaleString('he-IL', { maximumFractionDigits: 0 })} ₪
                    </div>
                    {subValue && (
                        <div className="text-sm opacity-90 bg-white/20 inline-block px-3 py-1.5 rounded-lg backdrop-blur-sm">
                            {subValue}
                        </div>
                    )}
                </div>
            </div>
        );

        const ComparisonCard = ({ title, current, next, rankCurrent, rankNext }) => {
            const diff = next - current;
            const percentDiff = ((diff / current) * 100).toFixed(1);
            
            return (
                <div className="bg-gradient-to-br from-amber-50 to-orange-50 rounded-xl p-5 border border-amber-200">
                    <h4 className="font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <TrendingUp className="w-5 h-5 text-amber-600" />
                        {title}
                    </h4>
                    <div className="space-y-3">
                        <div className="flex justify-between items-center">
                            <span className="text-sm text-slate-600">דרגה נוכחית ({rankCurrent})</span>
                            <span className="font-bold text-slate-800">{current.toLocaleString()} ₪</span>
                        </div>
                        <div className="flex justify-between items-center">
                            <span className="text-sm text-slate-600">דרגה הבאה ({rankNext})</span>
                            <span className="font-bold text-emerald-600">{next.toLocaleString()} ₪</span>
                        </div>
                        <div className="pt-3 border-t border-amber-200">
                            <div className="flex justify-between items-center">
                                <span className="text-sm font-semibold text-amber-700">עלייה צפויה</span>
                                <div className="text-left">
                                    <div className="font-bold text-emerald-600">+{diff.toLocaleString()} ₪</div>
                                    <div className="text-xs text-amber-600">+{percentDiff}%</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        function SalaryCalculator() {
            const [rank, setRank] = useState("39א");
            const [overtimeHours, setOvertimeHours] = useState(15);
            const [carType, setCarType] = useState("level3_service");
            const [childrenUnder5, setChildrenUnder5] = useState(2);
            const [children6to18, setChildren6to18] = useState(0);
            const [hasDegree, setHasDegree] = useState(true);
            const [partnerWorks, setPartnerWorks] = useState(true);
            const [gender, setGender] = useState("male"); // male or female
            const [miluimDays, setMiluimDays] = useState(0);
            const [insuranceCost, setInsuranceCost] = useState(6600);
            const [showAnnual, setShowAnnual] = useState(false);
            const [results, setResults] = useState(null);
            const [nextRankResults, setNextRankResults] = useState(null);
            
            // Toggle states for benefits
            const [includeInsuranceRefund, setIncludeInsuranceRefund] = useState(true);
            const [includeStudyFund, setIncludeStudyFund] = useState(true);
            const [includePension, setIncludePension] = useState(true);
            const [includeRecovery, setIncludeRecovery] = useState(true);
            const [includeClothing, setIncludeClothing] = useState(true);
            const [includeGifts, setIncludeGifts] = useState(true);

            const getNextRank = (currentRank) => {
                const ranks = Object.keys(RANK_SALARIES);
                const currentIndex = ranks.indexOf(currentRank);
                return currentIndex < ranks.length - 1 ? ranks[currentIndex + 1] : null;
            };

            const calculateMiluimPoints = (days) => {
                if (days < 30) return 0;
                if (days >= 30 && days < 40) return 0.5;
                if (days >= 40 && days < 50) return 0.75;
                if (days >= 50 && days < 55) return 1.0;
                
                // For 55+ days: 1.0 + 0.25 for every additional 5 days, up to 4 points max
                const additionalDays = days - 50;
                const additionalPoints = Math.floor(additionalDays / 5) * 0.25;
                return Math.min(1.0 + additionalPoints, 4.0);
            };

            useEffect(() => {
                calculateSalary();
                const nextRank = getNextRank(rank);
                if (nextRank) {
                    calculateSalary(nextRank);
                }
            }, [rank, overtimeHours, carType, childrenUnder5, children6to18, hasDegree, partnerWorks, gender, miluimDays, insuranceCost, 
                includeInsuranceRefund, includeStudyFund, includePension, includeRecovery, includeClothing, includeGifts]);

            const calculateSalary = (customRank = null) => {
                const currentRank = customRank || rank;
                const baseSalary = RANK_SALARIES[currentRank] || 0;
                const hourlyRate = baseSalary / 182;
                // חלוקת שעות נוספות: 2/3 ב-125%, 1/3 ב-150%
                const overtime125Hours = overtimeHours * (2/3);
                const overtime150Hours = overtimeHours * (1/3);
                const overtimePay = (hourlyRate * 1.25 * overtime125Hours) + (hourlyRate * 1.50 * overtime150Hours);
                const carPackage = CAR_PACKAGES[carType];
                const carGross = carPackage.value;
                const maonotPay = (partnerWorks && childrenUnder5 > 0) ? (Math.min(childrenUnder5, 2) * 330) : 0;
                const totalGross = baseSalary + overtimePay + carGross + maonotPay;

                let points = 2.25; // Resident base
                
                // Gender credit points
                if (gender === "female") {
                    points += 0.5; // Women get additional 0.5 point
                }
                
                if (hasDegree) points += 1;
                points += (childrenUnder5 * 2.5);
                points += (children6to18 * 1);
                
                // Miluim credit points
                const miluimPoints = calculateMiluimPoints(miluimDays);
                points += miluimPoints;
                
                const pointValue = 242;
                const taxCreditValue = points * pointValue;

                let taxableIncome = totalGross;
                let incomeTax = 0;
                
                if (taxableIncome > 0) {
                    let remaining = taxableIncome;
                    
                    // Bracket 1: 0 - 7,010 at 10%
                    let tax1 = Math.min(remaining, 7010) * 0.10;
                    remaining = Math.max(0, remaining - 7010);
                    
                    // Bracket 2: 7,011 - 10,060 at 14%
                    let tax2 = 0;
                    if (remaining > 0) {
                        let amount = Math.min(remaining, 10060 - 7010);
                        tax2 = amount * 0.14;
                        remaining = Math.max(0, remaining - (10060 - 7010));
                    }

                    // Bracket 3: 10,061 - 16,150 at 20%
                    let tax3 = 0;
                    if (remaining > 0) {
                        let amount = Math.min(remaining, 16150 - 10060);
                        tax3 = amount * 0.20;
                        remaining = Math.max(0, remaining - (16150 - 10060));
                    }

                    // Bracket 4: 16,151 - 22,440 at 31%
                    let tax4 = 0;
                    if (remaining > 0) {
                        let amount = Math.min(remaining, 22440 - 16150);
                        tax4 = amount * 0.31;
                        remaining = Math.max(0, remaining - (22440 - 16150));
                    }

                    // Bracket 5: 22,441 - 46,690 at 35%
                    let tax5 = 0;
                    if (remaining > 0) {
                        let amount = Math.min(remaining, 46690 - 22440);
                        tax5 = amount * 0.35;
                        remaining = Math.max(0, remaining - (46690 - 22440));
                    }

                    // Bracket 6: 46,691 - 60,130 at 47%
                    let tax6 = 0;
                    if (remaining > 0) {
                        let amount = Math.min(remaining, 60130 - 46690);
                        tax6 = amount * 0.47;
                        remaining = Math.max(0, remaining - (60130 - 46690));
                    }

                    // Bracket 7: 60,131+ at 50%
                    let tax7 = 0;
                    if (remaining > 0) {
                        tax7 = remaining * 0.50;
                    }

                    incomeTax = tax1 + tax2 + tax3 + tax4 + tax5 + tax6 + tax7;
                }
                
                incomeTax = Math.max(0, incomeTax - taxCreditValue);

                let socialSecurity = 0;
                if (totalGross <= 7522) {
                    socialSecurity = totalGross * 0.0395;
                } else {
                    socialSecurity = (7522 * 0.0395) + ((totalGross - 7522) * 0.12);
                }

                const pensionBase = baseSalary;
                const pensionDed = pensionBase * 0.07;
                const studyFundDed = pensionBase * 0.025;
                const unionDues = 50;
                const totalDeductions = incomeTax + socialSecurity + pensionDed + studyFundDed + unionDues;
                const netSalary = totalGross - totalDeductions;

                const studyFundEmployer = pensionBase * 0.075;
                const pensionEmployer = pensionBase * 0.135;
                const recoveryPay = 350;
                const clothing = 125;
                const gifts = 80;
                const insuranceRefundMonthly = carPackage.isCar ? (insuranceCost / 12) : 0;
                
                // Calculate total economic value based on toggles
                let totalEconomicValue = netSalary;
                if (includeInsuranceRefund) totalEconomicValue += insuranceRefundMonthly;
                if (includeStudyFund) totalEconomicValue += studyFundEmployer;
                if (includePension) totalEconomicValue += pensionEmployer;
                if (includeRecovery) totalEconomicValue += recoveryPay;
                if (includeClothing) totalEconomicValue += clothing;
                if (includeGifts) totalEconomicValue += gifts;

                const resultsObj = {
                    baseSalary,
                    overtimePay,
                    overtime125Hours,
                    overtime150Hours,
                    carGross,
                    maonotPay,
                    totalGross,
                    points,
                    miluimPoints,
                    taxCreditValue,
                    incomeTax,
                    socialSecurity,
                    pensionDed,
                    studyFundDed,
                    unionDues,
                    totalDeductions,
                    netSalary,
                    insuranceRefundMonthly,
                    studyFundEmployer,
                    pensionEmployer,
                    totalEconomicValue,
                    hourlyRate,
                    recoveryPay,
                    clothing,
                    gifts
                };

                if (customRank) {
                    setNextRankResults(resultsObj);
                } else {
                    setResults(resultsObj);
                }
            };

            if (!results) return (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 flex items-center justify-center">
                    <div className="text-center">
                        <Calculator className="w-16 h-16 text-blue-600 animate-pulse mx-auto mb-4" />
                        <p className="text-slate-600 font-medium">טוען מחשבון...</p>
                    </div>
                </div>
            );

            const nextRank = getNextRank(rank);

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 p-4 md:p-8 font-sans text-slate-800">
                    <div className="max-w-7xl mx-auto space-y-8">
                        
                        {/* Header */}
                        <header className="text-center py-8">
                            <div className="inline-flex items-center justify-center p-4 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-3xl shadow-2xl mb-6 transform hover:scale-105 transition-transform">
                                <Calculator className="w-10 h-10 text-white" />
                            </div>
                            <h1 className="text-4xl md:text-5xl font-extrabold text-slate-900 mb-3 bg-gradient-to-l from-blue-600 to-indigo-600 bg-clip-text text-transparent">
                                מחשבון שכר כלכלנים מתקדם
                            </h1>
                            <p className="text-slate-600 text-lg mb-4">דירוג 402 • חישוב מדויק ומקיף</p>
                            <div className="flex items-center justify-center gap-6 text-sm text-slate-500">
                                <div className="flex items-center gap-2">
                                    <CheckCircle className="w-4 h-4 text-emerald-500" />
                                    <span>כולל כל ההטבות</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <Zap className="w-4 h-4 text-amber-500" />
                                    <span>חישוב בזמן אמת</span>
                                </div>
                            </div>
                        </header>

                        {/* Main Stats Row */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <StatCard 
                                icon={CreditCard}
                                label="נטו חודשי"
                                value={results.netSalary}
                                subValue="נכנס לחשבון ב-1 לחודש"
                                gradient="bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-800"
                            />
                            <StatCard 
                                icon={TrendingUp}
                                label="שווי כלכלי כולל"
                                value={results.totalEconomicValue}
                                subValue="כולל כל ההטבות"
                                gradient="bg-gradient-to-br from-emerald-500 via-emerald-600 to-teal-700"
                            />
                            <StatCard 
                                icon={Calendar}
                                label={showAnnual ? "הכנסה שנתית נטו" : "ברוטו חודשי"}
                                value={showAnnual ? results.netSalary * 12 : results.totalGross}
                                subValue={showAnnual ? "12 חודשים" : "לפני מיסים וניכויים"}

                                                    <div className="text-xs text-slate-500 mt-0.5">כולל פיצויים</div>
                                                </div>
                                            </div>
                                            <span className={`font-bold font-mono text-lg ${includePension ? 'text-emerald-600' : 'text-slate-400'}`}>
                                                {results.pensionEmployer.toLocaleString()} ₪
                                            </span>
                                        </label>

                                        {/* Recovery Pay */}
                                        <label className="flex items-center justify-between p-3 bg-white rounded-lg border-2 border-slate-200 hover:border-amber-400 transition-all cursor-pointer">
                                            <div className="flex items-center gap-3 flex-1">
                                                <input 
                                                    type="checkbox" 
                                                    checked={includeRecovery}
                                                    onChange={(e) => setIncludeRecovery(e.target.checked)}
                                                    className="w-5 h-5 text-amber-600 rounded border-slate-300 focus:ring-amber-500 cursor-pointer"
                                                />
                                                <div className="flex-1">
                                                    <span className="font-medium text-slate-700">דמי הבראה (שנתי)</span>
                                                    <div className="text-xs text-slate-500 mt-0.5">משולם פעם בשנה</div>
                                                </div>
                                            </div>
                                            <span className={`font-bold font-mono text-lg ${includeRecovery ? 'text-emerald-600' : 'text-slate-400'}`}>
                                                {results.recoveryPay.toLocaleString()} ₪
                                            </span>
                                        </label>

                                        {/* Clothing */}
                                        <label className="flex items-center justify-between p-3 bg-white rounded-lg border-2 border-slate-200 hover:border-amber-400 transition-all cursor-pointer">
                                            <div className="flex items-center gap-3 flex-1">
                                                <input 
                                                    type="checkbox" 
                                                    checked={includeClothing}
                                                    onChange={(e) => setIncludeClothing(e.target.checked)}
                                                    className="w-5 h-5 text-amber-600 rounded border-slate-300 focus:ring-amber-500 cursor-pointer"
                                                />
                                                <div className="flex-1">
                                                    <span className="font-medium text-slate-700">דמי ביגוד</span>
                                                </div>
                                            </div>
                                            <span className={`font-bold font-mono text-lg ${includeClothing ? 'text-emerald-600' : 'text-slate-400'}`}>
                                                {results.clothing.toLocaleString()} ₪
                                            </span>
                                        </label>

                                        {/* Gifts */}
                                        <label className="flex items-center justify-between p-3 bg-white rounded-lg border-2 border-slate-200 hover:border-amber-400 transition-all cursor-pointer">
                                            <div className="flex items-center gap-3 flex-1">
                                                <input 
                                                    type="checkbox" 
                                                    checked={includeGifts}
                                                    onChange={(e) => setIncludeGifts(e.target.checked)}
                                                    className="w-5 h-5 text-amber-600 rounded border-slate-300 focus:ring-amber-500 cursor-pointer"
                                                />
                                                <div className="flex-1">
                                                    <span className="font-medium text-slate-700">מתנות לחגים</span>
                                                </div>
                                            </div>
                                            <span className={`font-bold font-mono text-lg ${includeGifts ? 'text-emerald-600' : 'text-slate-400'}`}>
                                                {results.gifts.toLocaleString()} ₪
                                            </span>
                                        </label>
                                        
                                        <div className="mt-5 p-4 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-xl text-white">
                                            <div className="flex items-center justify-between">
                                                <div>
                                                    <div className="text-emerald-100 text-sm mb-1">שווי כלכלי כולל</div>
                                                    <div className="text-3xl font-bold">
                                                        {results.totalEconomicValue.toLocaleString()} ₪
                                                    </div>
                                                    <div className="text-emerald-100 text-xs mt-1">לחודש (לפי הבחירה שלך)</div>
                                                </div>
                                                <TrendingUp className="w-16 h-16 text-emerald-200 opacity-50" />
                                            </div>
                                        </div>
                                    </div>
                                </Card>

                                {/* Promotion Comparison */}
                                {nextRank && nextRankResults && (
                                    <ComparisonCard 
                                        title="מה קורה בקידום לדרגה הבאה?"
                                        current={results.netSalary}
                                        next={nextRankResults.netSalary}
                                        rankCurrent={rank}
                                        rankNext={nextRank}
                                    />
                                )}

                                {/* Annual Summary */}
                                <Card className="p-6 bg-gradient-to-br from-violet-50 to-purple-50 border-violet-200">
                                    <SectionTitle 
                                        icon={Calendar} 
                                        title="סיכום שנתי" 
                                        subtitle="תחשיב להכנסה שנתית"
                                    />
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div className="bg-white rounded-xl p-5 border-2 border-violet-200">
                                            <div className="text-sm text-slate-600 mb-1">נטו שנתי (12 חודשים)</div>
                                            <div className="text-3xl font-bold text-violet-700">
                                                {(results.netSalary * 12).toLocaleString()} ₪
                                            </div>
                                        </div>
                                        <div className="bg-white rounded-xl p-5 border-2 border-violet-200">
                                            <div className="text-sm text-slate-600 mb-1">שווי כלכלי שנתי</div>
                                            <div className="text-3xl font-bold text-emerald-600">
                                                {(results.totalEconomicValue * 12).toLocaleString()} ₪
                                            </div>
                                        </div>
                                        <div className="bg-white rounded-xl p-5 border-2 border-violet-200">
                                            <div className="text-sm text-slate-600 mb-1">חיסכון שנתי לפנסיה</div>
                                            <div className="text-3xl font-bold text-blue-600">
                                                {((results.pensionDed + results.pensionEmployer) * 12).toLocaleString()} ₪
                                            </div>
                                            <div className="text-xs text-slate-500 mt-1">עובד + מעסיק</div>
                                        </div>
                                        <div className="bg-white rounded-xl p-5 border-2 border-violet-200">
                                            <div className="text-sm text-slate-600 mb-1">חיסכון שנתי לקה״ש</div>
                                            <div className="text-3xl font-bold text-indigo-600">
                                                {((results.studyFundDed + results.studyFundEmployer) * 12).toLocaleString()} ₪
                                            </div>
                                            <div className="text-xs text-slate-500 mt-1">עובד + מעסיק</div>
                                        </div>
                                    </div>
                                </Card>

                            </div>
                        </div>

                        {/* Footer */}
                        <div className="text-center py-6 text-sm text-slate-500 space-y-2">
                            <p className="mb-2">💡 המחשבון מבוסס על נתוני דירוג 402 ומספק הערכה כללית</p>
                            <p>לחישוב מדויק יש להתייעץ עם מחלקת משאבי אנוש</p>
                            <p className="text-xs text-slate-400 mt-4 pt-4 border-t border-slate-200">
                                © כל הזכויות שמורות ליוצר: יהודה סעדיה
                            </p>
                        </div>

                    </div>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SalaryCalculator />);
    </script>
</body>
</html>
